name = "padel-app"
compatibility_date = "2024-12-18"
pages_build_output_dir = "public"

# Producción (rama main)
[[d1_databases]]
binding = "DB"
database_name = "padel-db"
database_id = "0ec55c34-8da6-4c09-bb88-8840ea50a3ed"
migrations_dir = "migrations"

# Vistas previas (cualquier otra rama): base de datos separada para no tocar datos reales
[[env.preview.d1_databases]]
binding = "DB"
database_name = "padel-db-preview"
database_id = "c845a52a-6ed4-4a4c-819d-7fca6aa6669f"
migrations_dir = "migrations"

# La contraseña de administrador NO va aquí. Configúrala como secreto (en producción y en preview):
#   npx wrangler pages secret put ADMIN_PASSWORD --project-name=padel-app
#   npx wrangler pages secret put ADMIN_PASSWORD --project-name=padel-app --env preview

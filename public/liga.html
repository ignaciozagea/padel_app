<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🏆 Liga de Pádel | Gestión de Ligas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/liga.css">
    <link rel="stylesheet" href="css/comun.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Pádel GO">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">
    <div class="header">
        <div class="logo">
            <a href="index.html" style="text-decoration: none;">
                <h1>🏆 Liga de Pádel</h1>
            </a>
            <p>Gestión profesional de ligas | Sistema 3 sets | Datos persistentes</p>
        </div>
        <div class="admin-badge" id="adminBadge" style="display: none;">
            <span>👑 Modo Administrador</span>
            <a href="#" class="btn btn-secondary btn-sm" onclick="cerrarSesion()">Cerrar sesión</a>
        </div>
    </div>

    <!-- Navegación de Ligas -->
    <!-- Se rellena con las ligas de la base de datos (js/liga.js) -->
    <div class="liga-nav" id="ligaNav"></div>

    <!-- Panel de Administración -->
    <div id="adminPanel" style="display: none;">
        <div class="admin-grid">
            <div class="card">
                <h2>📋 Gestión de Equipos</h2>
                <div class="form-group">
                    <input type="text" id="teamName" placeholder="Nombre de la pareja (ej: García/López)">
                    <button class="btn btn-primary" id="addTeamBtn">➕ Agregar</button>
                </div>
                <div id="teamsList" class="teams-list"></div>
                <div class="info-text">Total de equipos: <span id="teamCount">0</span></div>
            </div>

            <div class="card">
                <h2>⚙️ Acciones</h2>
                <div class="form-group">
                    <button class="btn btn-primary" id="generateCalendarBtn">🎲 Generar Calendario</button>
                    <button class="btn btn-danger" id="resetLigaBtn">🔄 Resetear Liga</button>
                </div>
                <label class="ui-opcion">
                    <input type="checkbox" id="superTiebreakLiga">
                    <span>🎾 Tercer set como <strong>súper tie-break</strong> (a 10 puntos, diferencia de 2)</span>
                </label>
            </div>

            <div class="card">
                <h2>🏷️ Ligas</h2>
                <div class="form-group">
                    <input type="text" id="leagueName" placeholder="Nueva liga (ej: 🧒 Infantil)" maxlength="60">
                    <button class="btn btn-primary" id="addLeagueBtn">➕ Crear</button>
                </div>
                <div id="leaguesList" class="teams-list"></div>
            </div>
        </div>
    </div>
    
    <!-- Clasificación -->
    <div class="card full-width">
        <div class="card-cabecera">
            <h2>🏆 Clasificación</h2>
            <button class="btn btn-secondary btn-sm" id="shareStandingsBtn">📤 Compartir</button>
        </div>
        <div id="standingsContainer" class="standings-container"></div>
    </div>
    
    <!-- Calendario -->
    <div class="card full-width">
        <h2>📅 Calendario de Partidos (Mejor de 3 sets)</h2>
        <div id="matchesContainer" class="matches-container"></div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/liga.js"></script>

</body>
</html>

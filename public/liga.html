<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Liga · Pádel GO</title>
    <meta name="description" content="Clasificación, calendario y resultados de la liga de pádel">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/liga.css">
    <link rel="stylesheet" href="css/comun.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Pádel GO">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">
    <header class="topbar">
        <a class="marca" href="/" aria-label="Pádel GO, inicio">
            <svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#pelota"></use></svg>
            <span>Pádel GO</span>
        </a>
        <nav class="menu" aria-label="Secciones">
            <a href="/"><svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#inicio"></use></svg>Inicio</a>
            <a href="/liga" aria-current="page"><svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#trofeo"></use></svg>Liga</a>
            <a href="/torneo"><svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#cuadro"></use></svg>Torneo</a>
        </nav>
        <div class="admin-badge" id="adminBadge" style="display: none;">
            <svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#corona"></use></svg>
            <span class="admin-texto">Administrador</span>
            <button class="btn btn-secondary btn-sm" onclick="cerrarSesion()">
                <svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#salir"></use></svg>Salir
            </button>
        </div>
    </header>

    <div class="page-head">
        <h1><svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#trofeo"></use></svg>Liga</h1>
        <p>Clasificación, calendario y resultados</p>
    </div>

    <!-- Se rellena con las ligas de la base de datos (js/liga.js) -->
    <div class="liga-nav" id="ligaNav" role="tablist" aria-label="Ligas"></div>

    <!-- Panel de Administración -->
    <div id="adminPanel" style="display: none;">
        <div class="admin-grid">
            <div class="card">
                <h2><svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#parejas"></use></svg>Parejas</h2>
                <div class="form-group">
                    <input type="text" id="teamName" placeholder="Nombre de la pareja (ej: García/López)" maxlength="60">
                    <button class="btn btn-primary" id="addTeamBtn">
                        <svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#mas"></use></svg>Añadir
                    </button>
                </div>
                <div id="teamsList" class="teams-list"></div>
                <div class="info-text">Parejas inscritas: <span id="teamCount">0</span></div>
            </div>

            <div class="card">
                <h2><svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#ajustes"></use></svg>Acciones</h2>
                <div class="form-group">
                    <button class="btn btn-primary" id="generateCalendarBtn">
                        <svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#calendario"></use></svg>Generar calendario
                    </button>
                    <button class="btn btn-danger" id="resetLigaBtn">
                        <svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#reiniciar"></use></svg>Resetear liga
                    </button>
                </div>
                <label class="ui-opcion">
                    <input type="checkbox" id="superTiebreakLiga">
                    <span>Tercer set como <strong>súper tie-break</strong> (a 10 puntos, diferencia de 2)</span>
                </label>
            </div>

            <div class="card">
                <h2><svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#etiqueta"></use></svg>Ligas</h2>
                <div class="form-group">
                    <input type="text" id="leagueName" placeholder="Nueva liga (ej: Infantil)" maxlength="60">
                    <button class="btn btn-primary" id="addLeagueBtn">
                        <svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#mas"></use></svg>Crear
                    </button>
                </div>
                <div id="leaguesList" class="teams-list"></div>
            </div>
        </div>
    </div>

    <!-- Clasificación -->
    <section class="card">
        <div class="card-cabecera">
            <h2><svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#medalla"></use></svg>Clasificación</h2>
            <button class="btn btn-secondary btn-sm" id="shareStandingsBtn">
                <svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#compartir"></use></svg>Compartir
            </button>
        </div>
        <div id="standingsContainer" class="standings-container"></div>
    </section>

    <!-- Calendario -->
    <section class="card">
        <h2><svg class="ico" aria-hidden="true"><use href="/img/iconos.svg#calendario"></use></svg>Calendario</h2>
        <div id="matchesContainer" class="matches-container"></div>
    </section>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/liga.js"></script>

</body>
</html>

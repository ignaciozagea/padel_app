<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🏆 Liga de Pádel | Gestión Profesional</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/comun.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Pádel GO">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="container">
    <div class="hero">
        <div class="eyebrow">
            <span>🏸</span> La mejor gestión de pádel
        </div>
        <h1> Pádel GO</h1>
        <p>Gestión de ligas, registro de resultados y organización de torneos</p>
    </div>

    <div class="buttons-container">
        <a href="liga.html" class="btn btn-primary">
            <span>🏆</span> Liga
        </a>
        <a href="torneo.html" class="btn btn-secondary">
            <span>🎯</span> Torneo
        </a>
    </div>

    <div class="admin-section">
        <div id="adminLoggedOut">
            <p>🔐 ¿Administrador?</p>
            <button class="btn btn-admin" id="adminLoginBtn">
                <span>👑</span> Inicia sesión aquí
            </button>
        </div>
        <div id="adminLoggedIn" style="display: none;">
            <p>👑 Sesión de administrador iniciada <span id="sessionExpiry"></span></p>
            <button class="btn btn-admin" id="adminLogoutBtn">
                <span>🚪</span> Cerrar sesión
            </button>
        </div>
    </div>

    <!-- Solo aparece si el navegador permite instalar la web como app (js/index.js) -->
    <div class="admin-section" id="installSection" style="display: none;">
        <p>📲 Lleva Pádel GO en tu móvil</p>
        <button class="btn btn-secondary" id="installAppBtn">
            <span>📲</span> Instalar app
        </button>
    </div>
</div>

<!-- Modal Login -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <h3>🔐 Acceso Administrador</h3>
        <input type="password" id="adminPassword" placeholder="Contraseña" autocomplete="off">
        <button class="btn btn-primary" id="confirmLoginBtn" style="width: 100%;">Acceder</button>
        <div id="loginError" class="error-msg"></div>
        <button class="btn btn-secondary" onclick="cerrarModal()" style="margin-top: 1rem; width: 100%;">Cancelar</button>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/index.js"></script>


</body>
</html>

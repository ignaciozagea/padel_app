name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Comprobar sintaxis del frontend
        run: for f in public/js/*.js; do node --check "$f"; done

      - name: Ejecutar tests (API, migraciones y validación)
        run: npm test
